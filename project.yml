name: Assistant
options:
  bundleIdPrefix: com.syeyoung
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AssistantAPI:
    path: Packages/AssistantAPI
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Signed to run on this Mac only (no developer account).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Assistant:
    type: application
    platform: macOS
    sources: [Assistant, Shared]
    dependencies:
      - package: AssistantAPI
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syeyoung.assistant
        PRODUCT_NAME: Assistant
    info:
      path: Assistant/Info.plist
      properties:
        CFBundleDisplayName: Assistant
        LSApplicationCategoryType: public.app-category.productivity
        # Screenshots dropped on the Dock icon open in Capture.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          # Mails dragged from Apple Mail onto the Dock icon.
          - CFBundleTypeName: Mail message
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.mail.email, public.email-message]
  ShareExtension:
    type: app-extension
    platform: macOS
    sources: [ShareExtension, Shared]
    dependencies:
      - package: AssistantAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syeyoung.assistant.share
        PRODUCT_NAME: AssistantShare
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Assistant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
